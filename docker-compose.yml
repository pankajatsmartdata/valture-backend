services:
  db:
    image: postgres:15
    container_name: valture_postgres
    restart: always
    environment:
      POSTGRES_USER: valture_user
      POSTGRES_PASSWORD: valture_password
      POSTGRES_DB: valture_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: valture_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@valture.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
